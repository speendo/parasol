name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git cmake python3 python3-venv python3-pip curl ca-certificates \
            libglib2.0-0 libnss3 libnspr4 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libatspi2.0-0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libxkbcommon0 libasound2 \
            libcups2 libpango-1.0-0 libcairo2
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Install test server deps
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r test_server/requirements.txt -q
      - name: Build and test
        run: |
          . .venv/bin/activate
          npm test
      - name: Check committed assets are in sync
        # The job runs inside a container, so the checkout is owned by a
        # different uid than the step. Without safe.directory Git refuses the
        # repo, and `git diff -- <two paths>` silently degrades to --no-index,
        # comparing prsl_assets.c to prsl_assets.h and always failing.
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" \
            diff --exit-code -- src/prsl_assets.c src/prsl_assets.h \
            || { echo "::error::Committed assets are stale — run python3 scripts/generate_assets.py"; exit 1; }
      - name: Check CMake asset generation matches committed
        run: |
          out=$(mktemp -d)
          cmake -DPYTHON3="$(command -v python3)" \
            -DASSETS_SRC="$GITHUB_WORKSPACE" \
            -DCONFIG_FILE="$GITHUB_WORKSPACE/parasol_config.json" \
            -DOUT_DIR="$out" \
            -P cmake/generate_assets.cmake
          diff -u src/prsl_assets.c "$out/prsl_assets.c"
          diff -u src/prsl_assets.h "$out/prsl_assets.h"

  pio-smoke:
    # Compile+link smoke of the device sources (src/prsl.cpp, src/prsl_ws.cpp,
    # *.c) against the REAL pinned esp32async fork headers + Arduino-ESP32
    # core on an actual ESP32 toolchain (tests/pio_smoke). Guards against the
    # .cpp files drifting from the pinned fork API.
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git python3 python3-venv python3-pip curl ca-certificates
      - uses: actions/checkout@v7
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-espressif32-7.1.2
      - name: Install PlatformIO Core
        run: |
          python3 -m venv .venv-pio
          . .venv-pio/bin/activate
          pip install -q platformio
      - name: Compile+link smoke (prsl.cpp / prsl_ws.cpp vs esp32async fork)
        run: |
          . .venv-pio/bin/activate
          pio run -d tests/pio_smoke

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, pio-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:trixie-slim
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl ca-certificates
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci && npm run build
      - name: Build release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir parasol
          cp library.json CMakeLists.txt parasol/
          cp -r cmake scripts src include examples parasol/
          cp app.min.js index.html pico.jade.min.css parasol/
          tar czf "parasol-v${VERSION}.tar.gz" parasol
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: parasol-v*.tar.gz
