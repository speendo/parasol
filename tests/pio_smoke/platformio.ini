; Compile/link smoke of the device sources (src/prsl.cpp, src/prsl_ws.cpp, *.c)
; against the REAL pinned esp32async ESPAsyncWebServer v3.12.x fork headers and
; the Arduino-ESP32 core, on an actual ESP32 toolchain. Mirrors the README's
; zero-config consumer guidance: list only the esp32async fork in lib_deps;
; cJSON ships in the framework (Arduino-ESP32 / ESP-IDF json component), so no
; cJSON lib_deps is needed. src/ symlinks the repo's sources flat (parasol ->
; repo src/, prsl.h -> repo include/prsl.h) plus a minimal sketch (main.cpp)
; that pulls the whole library into the link.
[env:esp32]
platform = espressif32@7.1.2
framework = arduino
board = esp32dev
lib_deps =
    esp32async/ESPAsyncWebServer@^3.12.0
